	<div id="openfl-content"></div>
	<p id="game-load-error" style="display:none;color:#fff;text-align:center">Could not load the local game code. Open this folder through your local web server.</p>
	
	<script type="text/javascript">
		(function () {
		var localGameCode = document.createElement("script");
		localGameCode.src = new URL("./FNFWeekly.js", window.location.href).href;
		localGameCode.onload = function () {
			lime.embed ("FNFWeekly", "openfl-content", 1280, 720, { parameters: {} });
		};
		localGameCode.onerror = function () {
			var error = document.getElementById("game-load-error");
			if (error) error.style.display = "block";
		};
		document.head.appendChild(localGameCode);
	}());
	</script>
